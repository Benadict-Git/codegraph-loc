[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-loc"
version = "0.1.0"
description = "Repository code graphs and graph tools for fault localization with small local LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "unidiff>=0.7",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
swebench = ["datasets>=2.18"]
dev = ["pytest>=8"]

[project.scripts]
codegraph-build = "codegraph.build:main"

[tool.setuptools.packages.find]
include = ["codegraph*", "cgloc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
